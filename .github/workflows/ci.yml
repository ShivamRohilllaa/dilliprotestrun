name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Presence API tests
        run: npm run test:presence
      - name: Production build
        run: npm run build
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e -- --reporter=line,html
      - name: Production browser smoke tests
        run: npm run test:release
      - name: Upload browser failure reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: browser-failure-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
